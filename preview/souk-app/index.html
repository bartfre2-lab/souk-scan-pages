<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F9F9F7" />
    <link rel="icon" type="image/png" href="/preview/souk-app/assets/logo/logo.png" />
    <title>SOUK-SCAN</title>
    <!-- Boot: applies the saved theme, language and direction BEFORE the first
         paint (React applies them only after it mounts, which showed the
         wrong theme/direction for a moment) and marks native runs. -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem("soukscan.theme");
          if (t === "dark" || t === "light") d.setAttribute("data-theme", t);
          var l = localStorage.getItem("soukscan.language");
          if (l === "ar" || l === "fr" || l === "en") {
            d.lang = l;
            d.dir = l === "ar" ? "rtl" : "ltr";
          }
          if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
            d.classList.add("ss-native");
          }
        } catch (e) {}
      })();
    </script>
    <!-- Boot splash: same background and logo as the native Android launch
         screen, so the hand-off from native to web has no blank frame. It is
         removed by src/lib/bootSplash.ts once the app has real content. -->
    <style>html{background:#f7f4ee}html[data-theme=dark]{background:#171717}@media (prefers-color-scheme:dark){html:not([data-theme=light]){background:#171717}}#ss-boot{z-index:2147483000;background:#f7f4ee;justify-content:center;align-items:center;transition:opacity .32s;display:flex;position:fixed;inset:0}html[data-theme=dark] #ss-boot{background:#171717}@media (prefers-color-scheme:dark){html:not([data-theme=light]) #ss-boot{background:#171717}}#ss-boot img{width:96px;height:96px;transition:transform .32s;animation:.28s ease-out both ss-boot-in}.ss-native #ss-boot img{animation:none}#ss-boot.ss-boot--leaving{opacity:0;pointer-events:none}#ss-boot.ss-boot--leaving img{transform:scale(1.06)}@keyframes ss-boot-in{0%{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){#ss-boot,#ss-boot img{transition:none;animation:none}}</style>
    <script type="module" crossorigin src="/preview/souk-app/assets/index-DcKdlfEn.js"></script>
    <link rel="stylesheet" crossorigin href="/preview/souk-app/assets/index-BbuD7u6a.css">
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="ss-boot" aria-hidden="true"><img src="/preview/souk-app/assets/logo/logo.png" alt="" width="96" height="96" /></div>
    <div id="root"></div>
  </body>
</html>
